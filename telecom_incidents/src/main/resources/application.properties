# Сервер
server.port=8081

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/ttm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - создаёт таблицы
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Initialization - заполняет данными
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.encoding=UTF-8

# ВАЖНО: скрипты выполняются ПОСЛЕ Hibernate
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Статика
spring.web.resources.static-locations=classpath:/static/

# Camunda
camunda.base-url=http://localhost:8080/engine-rest
camunda.process-key=ttm_rule2

# Логирование
logging.level.com.ttm=DEBUG
logging.level.org.springframework.web=INFO